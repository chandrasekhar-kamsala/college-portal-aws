# Test Configuration using H2 In-Memory Database
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:college_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

app.admin.username=admin
app.admin.password=AdminSecurePass2026!
app.admin.email=admin@college.edu
app.jwt.secret=test_jwt_secret_key_at_least_256_bits_length_for_hmac_sha256_algorithm_test_environment_2026
app.jwt.expiration-ms=3600000
