# Spring Boot Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration with Environment Variable support and safe defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/college_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:college_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:college_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Spring Boot Actuator Endpoints for Health Checks and Reliability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.college.portal=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Admin bootstrap configuration from environment
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:AdminSecurePass2026!}
app.admin.email=${ADMIN_EMAIL:admin@college.edu}

# JWT Token Security Configuration
app.jwt.secret=${JWT_SECRET:college_portal_secret_key_2026_at_least_256_bits_for_hmac_sha256_security_token}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
