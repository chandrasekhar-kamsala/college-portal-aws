services:
  # ========================================================
  # Database Service: MySQL 8.0
  # ========================================================
  mysql:
    image: mysql:8.0
    container_name: college-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-college_root_secure_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-college_db}
      MYSQL_USER: ${MYSQL_USER:-college_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-college_user_secure_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - college-portal-network

  # ========================================================
  # Backend Service: Java 17 Spring Boot REST API
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-college_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-college_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-college_user_secure_pass_2026}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - college-portal-network

  # ========================================================
  # Frontend Service: React Vite served via Nginx Reverse Proxy
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - college-portal-network

# ========================================================
# Persistent Volumes & Dedicated Bridge Network
# ========================================================
volumes:
  mysql_data:
    name: college_mysql_data

networks:
  college-portal-network:
    name: college-portal-network
    driver: bridge
